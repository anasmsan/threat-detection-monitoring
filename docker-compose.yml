services:
  # --- Stockage et visualisation des LOGS (sécurité) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms768m -Xmx768m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1600m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 700m

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - webapp_logs:/var/log/webapp:ro
      - ssh_logs:/var/log/ssh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["--strict.perms=false"]
    mem_limit: 300m

  # --- Métriques (observabilité infra + application) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 300m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"
    mem_limit: 100m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    mem_limit: 200m

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - elasticsearch
    mem_limit: 300m

  # --- Cibles surveillées (génèrent le trafic à analyser) ---
  webapp:
    build: ./webapp
    ports:
      - "8000:8000"
    volumes:
      - webapp_logs:/var/log/webapp
    mem_limit: 150m

  ssh-target:
    build: ./ssh_target
    ports:
      - "2222:22"
    volumes:
      - ssh_logs:/var/log
    mem_limit: 100m

volumes:
  es_data:
  prometheus_data:
  webapp_logs:
  ssh_logs:
